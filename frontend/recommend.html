<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PM Internship | Apply & Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: url("applynow.jpg") no-repeat center center fixed;
      background-size: cover;
      color: #333;
      overflow-x: hidden;
    }

    header {
      background: #6a1b9a;
      color: white;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 20px;
    }

    header nav a {
      color: white;
      margin-left: 20px;
      text-decoration: none;
      font-weight: bold;
    }

    .slide {
      width: 100%;
      min-height: 100vh;
      padding: 30px 0;
      display: none;
      transition: 0.5s;
    }

    .active {
      display: block;
    }

    .container {
      background: white;
      width: 80%;
      max-width: 600px;
      margin: 30px auto;
      padding: 20px 30px;
      border-radius: 12px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
      position: relative;
    }

    h2,
    h3 {
      color: #6a1b9a;
      margin-bottom: 15px;
      text-align: center;
    }

    p {
      color: #555;
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 10px 0 5px;
    }

    input,
    textarea {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    textarea {
      resize: none;
      height: 100px;
    }

    .submit-btn {
      background: #6a1b9a;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      width: 100%;
      cursor: pointer;
      transition: 0.2s;
    }

    .submit-btn:hover {
      background: #4a0d6a;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    table th,
    table td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    table th {
      background: #eee;
    }

    .status {
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 13px;
      font-weight: bold;
    }

    .applied {
      background: #ffd54f;
      color: #333;
    }

    .review {
      background: #4fc3f7;
      color: #fff;
    }

    .selected {
      background: #81c784;
      color: #fff;
    }

    footer {
      text-align: center;
      padding: 20px;
      margin-top: 40px;
      background: #6a1b9a;
      color: white;
    }

    .success-message {
      display: none;
      text-align: center;
      color: green;
      font-weight: bold;
      margin-top: 15px;
    }

    .nav-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #6a1b9a;
      color: white;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
      border-radius: 5px;
    }

    #recommendTitle {
      color: #6a1b9a;
      margin: 15px;
      text-align: center;
    }

    #recommendations {
      display: flex;
      flex-wrap: wrap;
      /* allow multiple rows if many cards */
      justify-content: center;
      /* center horizontally */
      align-items: center;
      /* align items at the top of row */
      gap: 20px;
      /* spacing between cards */
      margin-top: 20px;
    }

    .card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin: 10px 0;
      box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
      background: #fff;
      width: 40%;
    }

    .card button {
      display: block;
      /* make it behave like a block */
      margin: 15px auto 0;
      /* auto centers horizontally */
      padding: 10px 20px;
      background: #6a1b9a;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }

    .card button:hover {
      background: #4a0d6a;
    }
  </style>
</head>

<body>

  <header>
    <h1>PM Internship</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="cards.html">Internships</a>
      <a href="login.html">Logout</a>
    </nav>
  </header>

  <!-- Form container -->
  <div class="container" id="formContainer">
    <h2>Internship Application 📝</h2>
    <p>Fill in your details to get internship recommendations.</p>

    <form id="applyForm">
      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" name="fullname" required>

      <label for="education">Education Qualifications</label>
      <input type="text" id="education" name="education" required>

      <label for="skills">Skills (comma separated)</label>
      <input type="text" id="skills" name="skills" placeholder="python, sql, ml" required>

      <label for="sector_interest">Sector of Interest</label>
      <input type="text" id="sector_interest" name="sector_interest" placeholder="Software Developer" required>

      <label for="location_preference">Preferred Location</label>
      <input type="text" id="location_preference" name="location_preference" placeholder="Bangalore" required>

      <button type="submit" class="submit-btn">Get Recommendations</button>
    </form>

    <div class="success-message" id="successMsg" style="display: none;">
      ✅ Recommendations fetched successfully!
    </div>
  </div>

  <!-- Recommendations section -->
  <h2 id="recommendTitle" style="display:none;">Recommendations</h2>
  <div id="recommendations"></div>

  <script>
    const form = document.getElementById('applyForm');
    const formContainer = document.getElementById('formContainer');
    const recommendationsDiv = document.getElementById('recommendations');
    const recommendTitle = document.getElementById('recommendTitle');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData(form);

      try {
        const response = await fetch("http://127.0.0.1:8000/recommend", {
          method: "POST",
          body: formData
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();
        console.log("API Response:", data);

        recommendationsDiv.innerHTML = "";
        const recs = data.recommendations;

        if (!recs || recs.length === 0) {
          recommendationsDiv.innerHTML = "<p>No recommendations found.</p>";
          return;
        }

        // Hide the form and show recommendations section
        formContainer.style.display = "none";
        recommendTitle.style.display = "block";

        recs.slice(0, 5).forEach(rec => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
    <h3>${rec.job_title}</h3>
    <p><strong>Category:</strong> ${rec.category}</p>
    <p><strong>Location:</strong> ${rec.job_loc}</p>
    <p><strong>Skills:</strong> ${rec.skills}</p>
    <p><strong>Education:</strong> ${rec.education}</p>
    <p><strong>Match:</strong> ${Math.round(rec.final_score * 100)}%</p>
    <button class="apply-btn">Apply</button>
  `;

          // Handle Apply button click
          const applyBtn = card.querySelector('.apply-btn');
          applyBtn.addEventListener('click', () => {
            alert("Applied for: " + rec.job_title);
            // 🔹 Here you could:
            // - Send POST request to backend to save application
            // - Redirect to an application form page
            // - Open an external job link if available
          });

          recommendationsDiv.appendChild(card);
        });

      } catch (error) {
        console.error("Error fetching recommendations:", error);
        recommendationsDiv.innerHTML = `<p style="color:red;">Failed to fetch recommendations. Check console.</p>`;
      }
    });
  </script>


</body>

</html>
